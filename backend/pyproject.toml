[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-agent-backend"
version = "0.1.0"
description = "Local browser agent backend (FastAPI + Playwright + Ollama)"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.128.8",
    "uvicorn[standard]==0.39.0",
    "playwright==1.60.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "respx==0.23.1",
    "ruff==0.14.6",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 90
target-version = "py39"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import sorting
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "RUF",      # ruff-specific
]
ignore = [
    # This project handles non-Latin text on purpose: the router's few-shot
    # examples and the routing eval are written in the scripts and punctuation
    # they would really arrive in. Flagging those characters is noise.
    "RUF001", "RUF002", "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# Tests reach into private helpers on purpose, and fakes mirror real signatures.
"tests/*" = ["SLF001", "ARG002"]
