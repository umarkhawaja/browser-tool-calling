[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "browser-agent-backend"
version = "0.1.0"
description = "Local browser agent backend (FastAPI + Playwright + Ollama)"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.128.8",
    "uvicorn[standard]==0.39.0",
    "playwright==1.60.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "pytest-asyncio==1.2.0",
    "respx==0.23.1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
